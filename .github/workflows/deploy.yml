name: Deploy blog

on:
  push:
    branches: [astro-source]
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本：astro 为新站，legacy 为旧站备份'
        type: choice
        default: astro
        options:
          - astro
          - legacy

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: inputs.version != 'legacy'
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        if: inputs.version != 'legacy'
        run: npm ci
        working-directory: site
      - name: Check, build and verify migration
        if: inputs.version != 'legacy'
        run: |
          npm run check
          npm run build
          npm test
        working-directory: site
        env:
          TZ: UTC
      - name: Check out frozen legacy website
        if: inputs.version == 'legacy'
        uses: actions/checkout@v7
        with:
          ref: hexo-live-before-astro
          path: legacy
      - name: Prepare legacy artifact
        if: inputs.version == 'legacy'
        run: |
          test -f legacy/index.html
          test -d legacy/2021
          touch legacy/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.version == 'legacy' && 'legacy' || 'site/dist' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
